extends: default

rules:
  comments:
    min-spaces-from-content: 1
  line-length:
    max: 120
    # Generated files: Ankra rewrites .ankra/ankra.yaml on every setup run, SOPS writes the sealed Secret.
    ignore: |
      .ankra/ankra.yaml
      sonar/manifests/secret.yaml
  truthy:
    check-keys: false
  document-start: disable
