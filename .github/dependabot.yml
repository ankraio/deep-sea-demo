version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      # @eslint/js declares a peer of eslint, so the two only install together.
      eslint:
        patterns:
          - eslint
          - "@eslint/*"
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      # init and analyze must run the same version or CodeQL refuses to start.
      codeql-action:
        patterns:
          - github/codeql-action*
