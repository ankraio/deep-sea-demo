# Ankra pipeline.
# Ankra runs this pipeline in your own cluster on every push, pull request and
# schedule it declares. Stages run as hardened Jobs sharing one workspace;
# ${{ … }} expressions are resolved per run. Edit it here - Git is the source
# of truth, and the definition on the default branch governs authority.
apiVersion: ankra.io/v1
kind: Pipeline
metadata:
  name: "deep-sea-demo"
on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"
    fork_policy: "read_only"
  manual: {}
concurrency:
  group: "${{ ankra.repository.provider }}:${{ ankra.repository.owner }}/${{ ankra.repository.name }}-${{ ankra.ref }}"
  cancel_in_progress: true
workspace:
  size: "10Gi"
  access: "rwo"
defaults:
  timeout: "30m"
  network: "egress-https"
permissions:
  contents: "read"
stages:
  - name: "checkout"
    kind: "checkout"
  - name: "test"
    kind: "run"
    image: "node:24-alpine"
    run: "npm ci && npm test"
    needs:
      - "checkout"
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      COREPACK_HOME: "/workspace/.ankra-node-cache/corepack"
      YARN_CACHE_FOLDER: "/workspace/.ankra-node-cache/yarn"
      YARN_GLOBAL_FOLDER: "/workspace/.ankra-node-cache/yarn-global"
      npm_config_cache: "/workspace/.ankra-node-cache/npm"
    cache:
      - key: "npm-${{ hashFiles('package-lock.json') }}"
        paths:
          - ".ankra-node-cache/npm"
        restore_keys:
          - "npm-"
        fallback: "none"
  - name: "build"
    kind: "build"
    needs:
      - "test"
    network: "egress-https"
    build:
      provenance: true
      sbom: true
  - name: "scan"
    kind: "scan"
    with:
      image_gate: "app"
      semgrep_config: "p/default p/docker p/github-actions p/javascript"
    needs:
      - "build"
    network: "egress-https"
    scan:
      scanners:
        - "semgrep"
        - "checkov"
        - "trivy"
      fail_on:
        checkov: "none"
        semgrep: "error"
        trivy: "app"
  - name: "gate"
    kind: "gate"
    needs:
      - "scan"
    gate:
      require_stages:
        - "scan"
  - name: "publish"
    kind: "publish"
    with:
      image: "registry.ankra.cloud/org-7b2fedb6-4d79-45fd-b71a-044a2cfddce7/deep-sea-demo"
    needs:
      - "gate"
    when:
      events:
        - "push"
    publish:
      promote_from: "pull_request"
