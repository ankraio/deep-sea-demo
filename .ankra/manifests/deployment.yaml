apiVersion: v1
kind: ServiceAccount
metadata:
  name: deep-sea-demo
  labels:
    app.kubernetes.io/name: deep-sea-demo
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deep-sea-demo
  labels:
    app.kubernetes.io/name: deep-sea-demo
  annotations:
    ankra.io/generated: "true"
spec:
  replicas: 1
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: deep-sea-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: deep-sea-demo
    spec:
      serviceAccountName: deep-sea-demo
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ankra-registry-pull
      containers:
        - name: deep-sea-demo
          image: registry.ankra.cloud/org-7b2fedb6-4d79-45fd-b71a-044a2cfddce7/deep-sea-demo:${{ ankra.image_tag }}
          imagePullPolicy: IfNotPresent
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: ANKRA_RELEASE
              value: "${{ ankra.image_tag }}"
            - name: NODE_ENV
              value: "production"
            - name: HOST
              value: "::"
            - name: PORT
              value: "8080"
            # Sonar's model: Qwen3 8B on demo-cloud, reached through the sonar-tunnel reverse tunnel.
            - name: OPENAI_BASE_URL
              value: "http://sonar-model/v1"
            - name: MODEL_NAME
              value: "qwen3-8b"
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: deep-sea-demo-env
                  key: OPENAI_API_KEY
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 150
            periodSeconds: 2
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: http
            failureThreshold: 5
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
      volumes:
        - name: tmp
          emptyDir: {}
