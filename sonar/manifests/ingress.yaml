apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sonar-llama-server
  namespace: sonar
  labels:
    app.kubernetes.io/name: sonar-llama-server
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    external-dns.alpha.kubernetes.io/hostname: sonar.lzrvjklgcw.7bl6jmr0fb.ankra.cc
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - sonar.lzrvjklgcw.7bl6jmr0fb.ankra.cc
      secretName: sonar-llama-server-tls
  rules:
    - host: sonar.lzrvjklgcw.7bl6jmr0fb.ankra.cc
      http:
        paths:
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: sonar-llama-server
                port:
                  name: http
