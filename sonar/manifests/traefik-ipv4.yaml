# demo-cloud's Traefik load balancer is IPv6 only, and the deep sea page runs on
# applications-demo, whose pods have no IPv6 route. This second load balancer
# fronts the same Traefik pods with a public IPv4 address as well (the Ankra
# Cloud IPv4 add-on). The original Service is left untouched.
apiVersion: v1
kind: Service
metadata:
  name: traefik-public-ipv4
  namespace: traefik
  labels:
    app.kubernetes.io/part-of: deep-sea-demo
  annotations:
    load-balancer.ankra.cloud/ipv4: "true"
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/instance: traefik-traefik
    app.kubernetes.io/name: traefik
  ports:
    - name: web
      port: 80
      targetPort: web
      protocol: TCP
    - name: websecure
      port: 443
      targetPort: websecure
      protocol: TCP
